plugins {
    id 'com.android.application'
}

android {
    namespace 'com.joat917.clearclipboardlite'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.joat917.clearclipboardlite"
        minSdk 24
        targetSdk 36
        versionCode 100
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            shrinkResources true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += [
                    'kotlin/**',
                    'META-INF/*.version',
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1',
                    'DebugProbesKt.bin'
            ]
        }
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {

}